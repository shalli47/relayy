<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #101214;
    --surface: #16191D;
    --surface-2: #1D2025;
    --border: #262A30;
    --border-soft: #1D2025;
    --text: #EDEEEF;
    --text-dim: #8A8F96;
    --text-faint: #55595F;
    --accent: #5EEAD4;
    --accent-dim: #1F3D39;
    --accent-text: #0B1211;
    --danger: #E5786B;
    --radius: 8px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  html, body {
    background: #0A0B0D;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .relay {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .relay__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 22px;
  }
  .relay__title {
    font-family: "Space Grotesk", -apple-system, sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }
  .relay__live {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .relay__live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.5);
    animation: pulse 2.2s ease-out infinite;
  }
  .relay__live-dot--off {
    background: var(--text-faint);
    animation: none;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0.45); }
    70% { box-shadow: 0 0 0 6px rgba(94, 234, 212, 0); }
    100% { box-shadow: 0 0 0 0 rgba(94, 234, 212, 0); }
  }

  .relay__compose {
    padding: 0 22px 20px;
  }
  .relay__textarea {
    width: 100%;
    min-height: 60px;
    resize: vertical;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    padding: 12px 14px;
    line-height: 1.5;
    transition: border-color 0.15s ease;
  }
  .relay__textarea::placeholder { color: var(--text-faint); }
  .relay__textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .relay__row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }
  .relay__hint {
    font-size: 12px;
    color: var(--text-faint);
  }
  .relay__send {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius-sm);
    padding: 9px 18px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: -apple-system, sans-serif;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .relay__send:hover { opacity: 0.85; }
  .relay__send:disabled { background: var(--surface-2); color: var(--text-faint); cursor: default; }

  .relay__list {
    max-height: 420px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .relay__empty {
    padding: 44px 24px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    line-height: 1.6;
  }
  .relay__item {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .relay__item:last-child { border-bottom: none; }
  .relay__item-body {
    flex: 1;
    min-width: 0;
  }
  .relay__item-text {
    font-size: 14.5px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
    color: var(--text);
  }
  .relay__item-text a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-dim);
  }
  .relay__item-text a:hover { border-bottom-color: var(--accent); }
  .relay__item-meta {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 6px;
    letter-spacing: 0.01em;
  }
  .relay__item-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .relay__icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius-sm);
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .relay__icon-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .relay__icon-btn--danger:hover { color: var(--danger); border-color: var(--danger); }

  .relay__status {
    padding: 9px 22px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    border-top: 1px solid var(--border);
  }

  [hidden] { display: none !important; }
  .relay { width: 100%; }
  .relay__header-right { display: flex; align-items: center; gap: 16px; }
  .relay__signout {
    background: none; border: none; padding: 0;
    color: var(--text-dim); font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .relay__signout:hover { color: var(--text); }
  .relay__auth { padding: 48px 28px 42px; text-align: center; }
  .relay__title--lg { font-size: 28px; margin-bottom: 10px; }
  .relay__auth-sub {
    font-size: 14px; line-height: 1.6; color: var(--text-dim);
    margin: 0 auto 28px; max-width: 300px;
  }
  .relay__google {
    display: inline-flex; align-items: center; gap: 10px;
    background: #FFFFFF; color: #1F1F1F; border: none;
    border-radius: var(--radius-sm); padding: 11px 20px;
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .relay__google:hover { opacity: 0.9; }
  .relay__google:disabled { opacity: 0.6; cursor: default; }
  .relay__auth-error {
    color: var(--danger); font-size: 12.5px; line-height: 1.5;
    margin: 16px auto 0; max-width: 320px; min-height: 1em;
  }
</style>

<div class="relay" id="relay-root">

  <div class="relay__empty" id="view-loading">Loading…</div>

  <div class="relay__auth" id="view-auth" hidden>
    <p class="relay__title relay__title--lg">Relay</p>
    <p class="relay__auth-sub">Your private clipboard between phone and laptop. Sign in to get yours.</p>
    <button class="relay__google" id="relay-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="relay__auth-error" id="relay-auth-error"></p>
  </div>

  <div id="view-app" hidden>
    <div class="relay__header">
      <p class="relay__title">Relay</p>
      <div class="relay__header-right">
        <div class="relay__live">
          <span class="relay__live-dot" id="relay-live-dot"></span>
          <span id="relay-live-label">connecting</span>
        </div>
        <button class="relay__signout" id="relay-signout">Sign out</button>
      </div>
    </div>
    <div class="relay__compose">
      <textarea class="relay__textarea" id="relay-input" placeholder="Paste a link or type a note — shows up on your other device instantly"></textarea>
      <div class="relay__row">
        <span class="relay__hint">Private to your account · clears after 7 days</span>
        <button class="relay__send" id="relay-send">Send</button>
      </div>
    </div>
    <div class="relay__list" id="relay-list"></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyBnYDYmfLYJLjYxA5W65LpjzvNIT2uiIgE",
    authDomain: "relay-app-fcbaf.firebaseapp.com",
    databaseURL: "https://relay-app-fcbaf-default-rtdb.firebaseio.com",
    projectId: "relay-app-fcbaf",
    storageBucket: "relay-app-fcbaf.firebasestorage.app",
    messagingSenderId: "906903853244",
    appId: "1:906903853244:web:08e6c7edce9ce223c018b9"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  const EXPIRY_MS = 7 * 24 * 60 * 60 * 1000;

  const $ = (id) => document.getElementById(id);
  const viewLoading = $('view-loading');
  const viewAuth = $('view-auth');
  const viewApp = $('view-app');
  const googleBtn = $('relay-google');
  const authError = $('relay-auth-error');
  const signOutBtn = $('relay-signout');
  const input = $('relay-input');
  const sendBtn = $('relay-send');
  const list = $('relay-list');
  const liveDot = $('relay-live-dot');
  const liveLabel = $('relay-live-label');

  let items = [];
  let itemsRef = null;

  function show(view) {
    viewLoading.hidden = view !== 'loading';
    viewAuth.hidden = view !== 'auth';
    viewApp.hidden = view !== 'app';
  }

  function setLive(ok, label) {
    liveDot.classList.toggle('relay__live-dot--off', !ok);
    liveLabel.textContent = label;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function linkify(text) {
    const escaped = escapeHtml(text);
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return escaped.replace(urlRegex, (url) =>
      '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>');
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 10) return 'just now';
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function render() {
    if (!items.length) {
      list.innerHTML = '<div class="relay__empty">Nothing here yet. Whatever you send shows up on every device you’re signed in on.</div>';
      return;
    }
    const sorted = [...items].sort((a, b) => b.ts - a.ts);
    list.innerHTML = sorted.map(item => `
      <div class="relay__item" data-id="${item.id}">
        <div class="relay__item-body">
          <div class="relay__item-text">${linkify(item.text)}</div>
          <div class="relay__item-meta">${timeAgo(item.ts)}</div>
        </div>
        <div class="relay__item-actions">
          <button class="relay__icon-btn" data-action="copy" data-id="${item.id}" title="Copy">⧉</button>
          <button class="relay__icon-btn relay__icon-btn--danger" data-action="delete" data-id="${item.id}" title="Delete">✕</button>
        </div>
      </div>
    `).join('');
  }

  // ---------- Auth ----------
  const AUTH_ERRORS = {
    'auth/unauthorized-domain': 'This site’s domain isn’t authorized in Firebase yet. Add it under Authentication → Settings → Authorized domains.',
    'auth/operation-not-allowed': 'Google sign-in isn’t enabled in Firebase yet. Turn it on under Authentication → Sign-in method.',
    'auth/network-request-failed': 'Network error. Check your connection and try again.'
  };

  function showAuthError(err) {
    if (!err || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
      authError.textContent = '';
      return;
    }
    authError.textContent = AUTH_ERRORS[err.code] || ('Sign-in failed (' + (err.code || 'unknown') + ').');
  }

  googleBtn.addEventListener('click', async () => {
    authError.textContent = '';
    googleBtn.disabled = true;
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (err) {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment') {
        auth.signInWithRedirect(provider);
        return;
      }
      showAuthError(err);
    } finally {
      googleBtn.disabled = false;
    }
  });

  auth.getRedirectResult().catch(showAuthError);

  signOutBtn.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged((user) => {
    if (itemsRef) { itemsRef.off(); itemsRef = null; }
    items = [];

    if (!user) {
      show('auth');
      return;
    }

    show('app');
    setLive(false, 'connecting');
    itemsRef = db.ref('users/' + user.uid + '/items');

    itemsRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const cutoff = Date.now() - EXPIRY_MS;
      const fresh = [];
      Object.keys(data).forEach((key) => {
        const entry = data[key];
        if (!entry || typeof entry.ts !== 'number') return;
        if (entry.ts < cutoff) {
          itemsRef.child(key).remove();   // auto-expire old items
        } else {
          fresh.push({ id: key, text: entry.text, ts: entry.ts });
        }
      });
      items = fresh;
      render();
      setLive(true, 'live');
    }, () => {
      setLive(false, 'offline');
    });
  });

  // ---------- Actions ----------
  function sendItem() {
    const text = input.value.trim();
    if (!text || !itemsRef) return;
    input.value = '';
    itemsRef.push({ text: text.slice(0, 5000), ts: Date.now() }).catch(() => {
      setLive(false, 'send failed');
    });
  }

  function deleteItem(id) {
    if (itemsRef) itemsRef.child(id).remove();
  }

  function copyItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    navigator.clipboard.writeText(item.text).then(() => {
      const prev = liveLabel.textContent;
      liveLabel.textContent = 'copied';
      setTimeout(() => { liveLabel.textContent = prev; }, 1200);
    }).catch(() => {});
  }

  sendBtn.addEventListener('click', sendItem);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendItem();
  });

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    if (btn.getAttribute('data-action') === 'delete') deleteItem(id);
    if (btn.getAttribute('data-action') === 'copy') copyItem(id);
  });
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    try {
      const swCode = `self.addEventListener('fetch', () => {});`;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    } catch (e) {}
  }
</script>
